CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y

# ===== TRACKBALL SPEED =====
# Normal mode: 2400 / 1 = 2400 effective CPI (fast, cross screen in one swipe)
# Was: 1200 / 4 = 300 effective CPI (very slow)
CONFIG_PMW3610_CPI=2400
CONFIG_PMW3610_CPI_DIVIDOR=1

# Snipe mode: 200 / 4 = 50 effective CPI (very fine, pixel-level precision)
# Was: 200 / 1 = 200 effective CPI (barely slower than normal)
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4

# Scroll speed (lower = faster, higher = slower)
CONFIG_PMW3610_SCROLL_TICK=70

# Sensor orientation
CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_PMW3610_INVERT_X=y

CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# ===== PERIPHERAL BATTERY =====
# This half is the central (Kconfig.defconfig sets ZMK_SPLIT_BLE_ROLE_CENTRAL for
# charybdis_right), so it is the only one the computer talks to. Without these, the host
# sees one battery - this half's - and the left half's level never leaves the split link.
#
# FETCHING subscribes the central to the peripheral's battery level over the split link.
# PROXY re-publishes it to the host: central_bas_proxy.c defines a SECOND primary Battery
# Service (0x180F) holding one Battery Level characteristic per peripheral. So the host
# ends up with two 0x2A19 characteristics on this device, not one with two values.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

# ===== POINTER RESPONSIVENESS =====
# ZMK defaults BT_PERIPHERAL_PREF_LATENCY to 30: with a 7.5 ms interval the keyboard may
# skip up to 30 connection events, so it need only transmit every ~225 ms. That is a big
# battery saving and invisible for keypresses, which are sparse. A trackball is the one
# thing it punishes: the sensor produces 125 reports/s and the link drains far slower, so
# they queue and the pointer keeps moving after the ball stops.
#
# 0 means transmit at every connection event. The sensor cannot go below 125 reports/s
# (the driver offers 250, 125 and 125_SW, and 125_SW already outputs 125), so draining
# faster is the only lever. Deep sleep bounds the battery cost: the radio only wakes this
# often while the keyboard is awake, and it disconnects entirely after 15 minutes idle.
# If the drain turns out to be noticeable, 5 is the next thing to try.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
