# Deep sleep — ZMK does NOT enable this by default, so without it the board
# never sleeps and the external rail (and therefore the trackball sensor) is
# never powered down. This is the main battery fix.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth transmit power — left at the default (0 dBm), which is plenty for
# halves ~30 cm apart. Was CONFIG_BT_CTLR_TX_PWR_PLUS_8=y, the maximum the
# nRF52840 offers, which cost battery for no benefit at this range.

# Battery reporting — defaults to n, so setting the interval alone did nothing
# and no battery level was ever reported. This was the only thing missing: the
# nice_nano_v2 board already senses the battery on the nRF52840's VDDH pin.
# Note the reading tracks the supply, so the percentage is meaningless while
# USB is plugged in.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Enable 32kHz crystal (better BLE timing accuracy)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Pointing/mouse support
CONFIG_ZMK_POINTING=y

# Debounce — reduce double key activations with light switches
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio — edit keymap live from browser, no reflashing needed
# Open https://zmk.studio with right half plugged in via USB
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

