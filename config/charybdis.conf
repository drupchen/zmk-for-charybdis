# Deep sleep — deliberately OFF. This was =y for a while; do not turn it back on
# without reading the rest of this comment, because the reason it was enabled no
# longer applies.
#
# It was enabled to stop the keyboard going flat in a day or two. But that drain
# was really the SPIM3 anomaly (nRF52840 erratum 195, ~900 µA after disable) and
# the external rail never powering down the trackball sensor — both fixed
# separately, in the shield overlays. With those gone, idle-but-connected costs
# roughly 0.6 mA: the radio wakes ~133×/s for ~400 µs at ~6 mA, plus the sensor
# in rest. Over a ten-hour night that is about 6 mAh out of a ~850 mAh cell.
# (The 304070 cells are labelled 1500 mAh; at 8.4 cm³ and ~0.38 Wh/cm³ the true
# figure is nearer 850.)
#
# What it cost was waking the computer. ZMK's deep sleep is nRF52 System OFF, and
# waking from System OFF is a RESET, not a resume. So the first keypress is spent
# rebooting the keyboard, and while it sleeps there is no BLE link for the host to
# wake on at all. Both halves sleep independently, so the left has to wake,
# reconnect to the right, and only then does anything reach the computer. In
# practice that meant plugging both halves in to wake the machine.
#
# Under 1% of capacity a night is not worth that. To re-enable, set =y; the two
# timeouts below are inert while this is n and are kept so it is a one-line change.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth transmit power — left at the default (0 dBm), which is plenty for
# halves ~30 cm apart. Was CONFIG_BT_CTLR_TX_PWR_PLUS_8=y, the maximum the
# nRF52840 offers, which cost battery for no benefit at this range.

# Battery reporting — defaults to n, so setting the interval alone did nothing
# and no battery level was ever reported. This was the only thing missing: the
# nice_nano_v2 board already senses the battery on the nRF52840's VDDH pin.
# Note the reading tracks the supply, so the percentage is meaningless while
# USB is plugged in.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Enable 32kHz crystal (better BLE timing accuracy)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Pointing/mouse support
CONFIG_ZMK_POINTING=y

# Debounce — reduce double key activations with light switches
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio — edit keymap live from browser, no reflashing needed
# Open https://zmk.studio with right half plugged in via USB
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB (disabled — uncomment to enable)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
